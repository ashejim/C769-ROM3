  # NOTE: myst_enable_extensions REPLACES Jupyter Book's default list (it does not add to it),
  # so we must list every extension this book uses -- not just 'substitution' -- or the others
  # (colon_fence ':::', dollarmath '$...$', linkify, tasklist) would be turned off and break rendering.
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution
    - tasklist
  # --- How to use these in .md files ---
  # Reference the name with {{ }} -- the substitution value is rendered as Markdown,
  # so the whole link appears. For example:
  #     > {{ task1_form }}
  #     ...if you answered Yes to question 3, also submit the {{ restricted_form }}.

